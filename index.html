<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#59622d"><meta name="description" content="Makaria — onde prosperidade encontra plenitude.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="logo.svg">
<title>Makaria</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<section id="auth" class="screen auth-screen">
  <div class="brand"><img src="logo.svg"><div class="brand-name">MAKARIA</div><div class="tagline">onde prosperidade encontra plenitude.</div></div>
  <div class="auth-card" id="authCard"></div>
  <p class="legal">Seus dados são privados e vinculados à sua conta.</p>
</section>
<section id="shell" class="hidden">
<header class="topbar"><button class="icon-btn" id="menuBtn">☰</button><div class="top-brand"><img src="logo.svg"><span>MAKARIA</span></div><button class="icon-btn" id="lockBtn">⌁</button></header>
<main id="view"></main>
<nav class="bottom"><button data-view="home" class="active">⌂<span>Início</span></button><button data-view="transactions">▣<span>Lançamentos</span></button><button id="addBtn" class="add">+</button><button data-view="goals">☆<span>Metas</span></button><button data-view="profile">♙<span>Perfil</span></button></nav>
</section>
<div id="modal" class="modal hidden"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
</body></html>
