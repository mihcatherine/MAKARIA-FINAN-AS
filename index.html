<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Makaria</title>

  <meta name="theme-color" content="#6b7650">
  <meta name="description" content="Makaria — onde prosperidade encontra plenitude.">

  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>

  <div id="app">

    <!-- ÁREA DE AUTENTICAÇÃO -->
    <section id="auth" class="auth-page">
      
      <div class="brand">
        <img src="logo.svg" alt="Makaria" class="brand-logo">
        <p>onde prosperidade encontra plenitude.</p>
      </div>

      <div id="authCard" class="auth-card">
        <!-- preenchido pelo app.js -->
      </div>

    </section>


    <!-- ÁREA PRINCIPAL DO APP -->
    <section id="shell" class="shell hidden">

      <header class="topbar">

        <div class="brand-small">
          <img src="logo.svg" alt="Makaria">
          <span>Makaria</span>
        </div>

        <button id="lockBtn" class="icon-btn" aria-label="Bloquear">
          🔒
        </button>

      </header>


      <main id="view">
        <!-- conteúdo preenchido pelo app.js -->
      </main>


      <!-- BOTÃO FLUTUANTE -->
      <button id="addBtn" class="fab" aria-label="Novo lançamento">
        +
      </button>


      <!-- NAVEGAÇÃO INFERIOR -->
      <nav class="bottom">

        <button data-view="home" class="active">
          <span>⌂</span>
          <small>Início</small>
        </button>

        <button data-view="transactions">
          <span>↕</span>
          <small>Lançamentos</small>
        </button>

        <button data-view="goals">
          <span>◎</span>
          <small>Metas</small>
        </button>

        <button data-view="profile">
          <span>◉</span>
          <small>Perfil</small>
        </button>

      </nav>

    </section>


    <!-- MODAL -->
    <div id="modal" class="modal hidden"></div>

  </div>


  <!-- SUPABASE -->
  <!-- IMPORTANTE: precisa vir ANTES do app.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- APP -->
  <script src="app.js"></script>

</body>
</html>
